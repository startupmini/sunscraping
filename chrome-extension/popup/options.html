<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sunscraping — Pengaturan</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='6 6 36 36'%3E%3Cpath fill='%23FF9800' d='M11 11H37V37H11z'/%3E%3Cpath fill='%23FF9800' d='M11.272 11.272H36.728V36.728H11.272z' transform='rotate(-45.001 24 24)'/%3E%3Cpath fill='%23FFEB3B' d='M13,24c0,6.077,4.923,11,11,11c6.076,0,11-4.923,11-11s-4.924-11-11-11C17.923,13,13,17.923,13,24'/%3E%3C/svg%3E">
  <style>
    :root {
      --ink: #0b1220;
      --text: #172033;
      --muted: #475467;
      --faint: #667085;
      --bg: #f6f7f9;
      --surface: #ffffff;
      --surface-soft: #f9fafb;
      --line: #e5e7eb;
      --line-strong: #d5d9e0;
      --brand: #1d4ed8;
      --brand-dark: #1e40af;
      --brand-soft: #eff4ff;
      --success: #067647;
      --success-soft: #ecfdf3;
      --warning: #b54708;
      --danger: #b42318;
      --danger-soft: #fef3f2;
      --radius-lg: 12px;
      --radius-md: 10px;
      --radius-sm: 8px;
      --radius-xs: 6px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px 20px 48px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, p { margin: 0; }
    code {
      padding: 1px 5px;
      border: 1px solid var(--line);
      border-radius: var(--radius-xs);
      background: var(--surface-soft);
      font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
      font-size: 12px;
    }

    .wrap {
      width: min(560px, 100%);
      margin: 0 auto;
    }

    /* ---------- Card ---------- */
    .card {
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--surface);
      overflow: hidden;
    }

    .card-head {
      padding: 20px 22px 16px;
      border-bottom: 1px solid var(--line);
    }

    .card-head h1 {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .brand-mark { display: block; width: 22px; height: 22px; flex: 0 0 auto; }
    .brand-mark svg { display: block; width: 100%; height: 100%; }

    .card-head p {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }

    form { padding: 18px 22px 22px; }

    /* ---------- Fields ---------- */
    .field { margin-bottom: 16px; }

    label.field-label {
      display: block;
      margin-bottom: 6px;
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
    }

    .input-wrap { position: relative; }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      min-height: 36px;
      padding: 0 10px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text);
      font: inherit;
      font-size: 13px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input.has-action { padding-right: 40px; }

    input::placeholder { color: var(--faint); }

    input:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.1);
    }

    .reveal-btn {
      position: absolute;
      top: 50%;
      right: 4px;
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      transform: translateY(-50%);
      border: 0;
      border-radius: var(--radius-xs);
      background: transparent;
      color: var(--faint);
      cursor: pointer;
    }

    .reveal-btn:hover { background: var(--surface-soft); color: var(--text); }
    .reveal-btn:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }

    .hint {
      margin-top: 5px;
      color: var(--faint);
      font-size: 12px;
      line-height: 1.45;
    }

    /* ---------- Status ---------- */
    .status {
      display: flex;
      align-items: flex-start;
      gap: 7px;
      margin-top: 14px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--surface-soft);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .status[hidden] { display: none; }

    .status::before {
      content: '';
      width: 6px;
      height: 6px;
      flex: 0 0 auto;
      margin-top: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .status.ok {
      border-color: #abefc6;
      background: var(--success-soft);
      color: var(--success);
    }

    .status.error {
      border-color: #fecdca;
      background: var(--danger-soft);
      color: var(--danger);
    }

    .dirty-hint {
      margin-top: 12px;
      color: var(--faint);
      font-size: 12px;
      line-height: 1.45;
    }

    .dirty-hint[hidden] { display: none; }

    .dirty-hint b { color: var(--warning); font-weight: 600; }

    /* ---------- Actions ---------- */
    .actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 36px;
      padding: 0 14px;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .btn:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

    .btn:disabled {
      border-color: var(--line);
      background: var(--surface-soft);
      color: var(--faint);
      cursor: default;
    }

    .btn-primary {
      background: var(--brand);
      color: #ffffff;
    }

    .btn-primary:hover:not(:disabled) { background: var(--brand-dark); }

    .btn-secondary {
      border-color: var(--line-strong);
      background: var(--surface);
      color: var(--text);
    }

    .btn-secondary:hover:not(:disabled) {
      border-color: #b9c0cb;
      background: var(--surface-soft);
    }

    @media (max-width: 560px) {
      body { padding: 20px 14px 32px; }
      .card-head, form { padding-left: 16px; padding-right: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <main class="card">
      <header class="card-head">
        <h1>
          <span class="brand-mark" aria-hidden="true"><svg viewBox="6 6 36 36" focusable="false"><path fill="#FF9800" d="M11 11H37V37H11z"/><path fill="#FF9800" d="M11.272 11.272H36.728V36.728H11.272z" transform="rotate(-45.001 24 24)"/><path fill="#FFEB3B" d="M13,24c0,6.077,4.923,11,11,11c6.076,0,11-4.923,11-11s-4.924-11-11-11C17.923,13,13,17.923,13,24"/></svg></span>
          Pengaturan
        </h1>
        <p>Koneksi sunscraping ke backend lokal.</p>
      </header>

      <form id="settingsForm" novalidate>
        <div class="field">
          <label class="field-label" for="apiBase">API Base URL</label>
          <input type="text" id="apiBase" placeholder="http://localhost:5000" autocomplete="off" spellcheck="false">
          <p class="hint">Hanya localhost, 127.0.0.1, atau ::1.</p>
        </div>

        <div class="field">
          <label class="field-label" for="apiKey">API Key</label>
          <div class="input-wrap">
            <input type="password" id="apiKey" class="has-action" placeholder="Tempel API key" autocomplete="off" spellcheck="false">
            <button type="button" id="toggleKey" class="reveal-btn" aria-label="Tampilkan API key" aria-pressed="false">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/><line id="eyeSlash" x1="3" y1="3" x2="21" y2="21"/></svg>
            </button>
          </div>
          <p class="hint">Salin dari Control Panel → API key.</p>
        </div>

        <div id="status" class="status" role="status" aria-live="polite" hidden></div>

        <p id="dirtyHint" class="dirty-hint" hidden>
          Perubahan belum disimpan. Klik <b>Simpan</b>.
        </p>

        <div class="actions">
          <button type="button" id="testBtn" class="btn btn-secondary">Uji koneksi</button>
          <button type="submit" id="saveBtn" class="btn btn-primary" disabled>Simpan</button>
        </div>
      </form>
    </main>
  </div>

  <script src="options.js"></script>
</body>
</html>
